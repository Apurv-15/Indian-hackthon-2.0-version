<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AegisAI Phishing Shield</title>
  <style>
    :root {
      --bg: #fbf9f5;
      --card: #f2ece1;
      --primary: #211c1a;
      --primary-text: #ffffff;
      --secondary-bg: #eae2d5;
      --secondary-border: #d5c8b7;
      --text: #1a1615;
      --subtext: #4a3f39;
      --safe: #166534;
      --medium: #854d0e;
      --high: #991b1b;
    }

    body {
      width: 320px;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    .container {
      padding: 20px;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .logo {
      width: 30px;
      height: 30px;
      border-radius: 8px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      font-weight: 700;
      color: var(--text);
    }

    .status-card {
      background: var(--card);
      border-radius: 12px;
      padding: 14px 16px;
      border: 1px solid #e5dbcd;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .status-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }

    .status-value {
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 10.5px;
      font-weight: 700;
      background: #e2f0d9;
      color: #166534;
      border: 1px solid #c5e1b2;
    }

    .features {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
    }

    .icon-box {
      width: 24px;
      height: 24px;
      background: #ede6da;
      border: 1px solid #dfd5c5;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    footer {
      border-top: 1px solid #e7dfd3;
      padding: 10px 20px;
      background: #f4ede3;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: var(--subtext);
      font-weight: 500;
    }

    button {
      background: #211c1a;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 12.5px;
      font-weight: 600;
      transition: all 0.2s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    button:hover {
      background: #38302c;
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    button.secondary {
      background: var(--secondary-bg);
      color: #211c1a;
      border: 1.5px solid var(--secondary-border);
      box-shadow: none;
    }

    button.secondary:hover {
      background: #dfd6c7;
      border-color: #c4b5a0;
    }

    #trust-result {
      margin-top: 14px;
      font-size: 12px;
    }

    #trust-result .trust-score-line {
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text);
    }

    #trust-result ul {
      margin: 6px 0 10px 0;
      padding-left: 18px;
      color: var(--subtext);
    }

    #trust-result li {
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <img src="icons/icon48.png" class="logo">
      <h1>AegisAI Shield</h1>
    </header>

    <div class="status-card">
      <div class="status-label">Global Protection</div>
      <div class="status-value">
        <span id="status-indicator">●</span> ACTIVE
        <span class="badge">V1.0</span>
      </div>
    </div>

    <ul class="features">
      <li class="feature-item">
        <div class="icon-box">🛡️</div>
        Real-time Link Scanner
      </li>
      <li class="feature-item">
        <div class="icon-box">🔍</div>
        Deep Content Analysis
      </li>
      <li class="feature-item">
        <div class="icon-box">🧠</div>
        ML Confidence Scoring
      </li>
    </ul>

    <div style="margin-top: 20px; display: flex; gap: 8px;">
        <button id="scan-page" style="flex: 1;">Scan Entire Page</button>
    </div>
    <div style="margin-top: 8px; display: flex; gap: 8px;">
        <button id="check-store" class="secondary" style="flex: 1;">Check This Store</button>
    </div>

    <div id="trust-result" class="status-card" style="display: none;"></div>
  </div>
  <footer>
    <span id="footer-status"><span id="footer-dot" style="color: #10b981;">●</span> Bridge: checking...</span>
    <span>v1.0.0</span>
  </footer>
  <script src="popup.js"></script>
</body>
</html>
